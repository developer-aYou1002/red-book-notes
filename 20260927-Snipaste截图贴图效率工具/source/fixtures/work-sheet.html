<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>工作清单｜Snipaste 测试</title>
  <style>
    body { margin: 0; background: #f7f3ec; color: #2b302e; font-family: "Microsoft YaHei", sans-serif; }
    main { width: 980px; margin: 54px auto; background: #fff; border-radius: 24px; box-shadow: 0 18px 60px #40382b20; padding: 44px 52px; }
    .tag { display: inline-block; padding: 8px 16px; border-radius: 999px; background: #fff0c7; color: #8c6200; font-weight: 700; }
    h1 { font-size: 38px; margin: 20px 0 28px; }
    table { width: 100%; border-collapse: collapse; font-size: 22px; }
    th, td { border: 2px solid #e7e0d5; padding: 18px; text-align: left; }
    th { background: #f6f1e9; }
    td.empty { color: #9a9286; }
    .tip { margin-top: 28px; color: #786f64; font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">虚构测试材料</span>
    <h1>活动执行清单</h1>
    <table>
      <tr><th>字段</th><th>待填写内容</th><th>状态</th></tr>
      <tr><td>活动日期</td><td class="empty">请对照资料填写</td><td>待确认</td></tr>
      <tr><td>报名截止</td><td class="empty">请对照资料填写</td><td>待确认</td></tr>
      <tr><td>目标人数</td><td class="empty">请对照资料填写</td><td>待确认</td></tr>
      <tr><td>场地确认</td><td class="empty">请对照资料填写</td><td>待确认</td></tr>
    </table>
    <div class="tip">测试目标：把资料中的关键信息贴在旁边，对照填写时不再切回原页面。</div>
  </main>
</body>
</html>
