<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>匿名活动资料｜Snipaste 测试</title>
  <style>
    body { margin: 0; background: #eef3f1; color: #17352f; font-family: "Microsoft YaHei", sans-serif; }
    main { width: 900px; margin: 56px auto; background: #fff; border-radius: 24px; box-shadow: 0 18px 60px #24483b22; padding: 46px 54px; }
    .tag { display: inline-block; padding: 8px 16px; border-radius: 999px; background: #dff6ed; color: #0d7c63; font-weight: 700; }
    h1 { font-size: 38px; margin: 20px 0 10px; }
    .note { color: #64766f; margin-bottom: 34px; }
    section { border: 2px solid #dfe9e5; border-radius: 18px; padding: 24px 28px; margin: 18px 0; }
    h2 { margin: 0 0 14px; font-size: 24px; }
    li { font-size: 22px; line-height: 1.8; }
    strong { color: #0d7c63; }
  </style>
</head>
<body>
  <main>
    <span class="tag">虚构测试材料</span>
    <h1>秋季阅读活动｜执行摘要</h1>
    <div class="note">仅用于本篇 Snipaste 功能测试，不含真实姓名、客户或公司资料。</div>
    <section>
      <h2>需要填写到工作清单的信息</h2>
      <ul>
        <li>活动日期：<strong>10 月 12 日</strong></li>
        <li>报名截止：<strong>10 月 8 日 18:00</strong></li>
        <li>目标人数：<strong>80 人</strong></li>
        <li>场地确认：<strong>周三前完成</strong></li>
      </ul>
    </section>
    <section>
      <h2>文案要求</h2>
      <ul>
        <li>开头直接写参与收益</li>
        <li>正文不超过 180 字</li>
        <li>结尾提醒截止时间</li>
      </ul>
    </section>
  </main>
</body>
</html>
